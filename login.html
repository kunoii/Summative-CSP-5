<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>document.documentElement.dataset.theme = localStorage.getItem('app-theme') || '';</script>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="A-TEN">
  <link rel="stylesheet" href="shared.css" />
  <title>Sign In — A-TEN</title>
  <style>
    body {
      background: var(--navy);
      color: var(--accent);
      min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: calc(40px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom));
      font-family: var(--font);
    }

    .logo {
      font-size: 72px; font-weight: 900;
      color: var(--accent); letter-spacing: 0.04em;
      line-height: 1; margin-bottom: 6px;
    }

    .role-badge {
      font-size: 13px; font-weight: 700;
      color: rgba(255,255,255,0.5); letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 28px;
    }

    .card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px; padding: 28px 24px;
      width: 100%; max-width: 420px;
      display: flex; flex-direction: column; gap: 16px;
    }

    .tabs {
      display: flex;
      background: rgba(0,0,0,0.25);
      border-radius: 10px; overflow: hidden;
    }

    .tab-btn {
      flex: 1; padding: 11px; font-size: 15px; font-weight: 600;
      background: none; border: none; color: rgba(255,255,255,0.5);
      cursor: pointer; transition: background 0.2s, color 0.2s; font-family: var(--font);
    }
    .tab-btn.active { background: var(--accent); color: var(--navy); }
    .tab-btn:hover:not(.active) { color: rgba(255,255,255,0.85); }

    .form-section { display: flex; flex-direction: column; gap: 14px; }
    .form-section.hidden { display: none; }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field-label {
      font-size: 12px; font-weight: 700;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase; letter-spacing: 0.07em;
    }

    .field-input {
      width: 100%; padding: 12px 14px; font-size: 16px;
      background: rgba(0,0,0,0.3);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 10px; color: #e2e8f0;
      outline: none; font-family: var(--font); transition: border-color 0.15s;
    }
    .field-input:focus { border-color: var(--accent); }
    .field-input::placeholder { color: rgba(255,255,255,0.22); }

    .keep-signed {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; color: rgba(255,255,255,0.6); cursor: pointer; user-select: none;
    }
    .keep-signed input[type="checkbox"] {
      width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0;
    }

    .submit-btn {
      width: 100%; padding: 14px; font-size: 17px; font-weight: 700;
      background: var(--accent); color: var(--navy);
      border: none; border-radius: 12px; cursor: pointer;
      transition: opacity 0.15s; font-family: var(--font); margin-top: 2px;
    }
    .submit-btn:hover { opacity: 0.88; }

    .msg { font-size: 13px; border-radius: 8px; padding: 10px 14px; display: none; line-height: 1.5; }
    .msg.show { display: block; }
    .msg-error   { color: #f87171; background: rgba(220,38,38,0.15); border: 1px solid rgba(220,38,38,0.3); }
    .msg-success { color: #4ade80; background: rgba(22,163,74,0.15);  border: 1px solid rgba(22,163,74,0.3); }

    .back-link {
      font-size: 15px; color: rgba(255,255,255,0.45);
      text-decoration: none; margin-top: 16px; text-align: center;
      transition: color 0.15s;
    }
    .back-link:hover { color: rgba(255,255,255,0.8); }

    .field-hint { font-size: 13px; color: rgba(255,255,255,0.35); margin-top: 4px; line-height: 1.4; }
    .phone-row { display: flex; gap: 8px; }
    .phone-country { flex: 0 0 44%; }
    .phone-number  { flex: 1; min-width: 0; }
  </style>
  <script src="phone.js"></script>
</head>

<body>

  <p class="logo">A-TEN</p>
  <p class="role-badge" id="role-badge">Sign in as User</p>

  <div class="card">
    <div class="tabs" id="auth-tabs">
      <button class="tab-btn active" id="tab-login"  onclick="showTab('login')">Log In</button>
      <button class="tab-btn"        id="tab-signup" onclick="showTab('signup')">Sign Up</button>
    </div>

    <!-- User login (no password) -->
    <div class="form-section hidden" id="form-user-login">
      <div class="field">
        <label class="field-label" id="lbl-user-username">Username</label>
        <input class="field-input" type="text" id="user-username"
          placeholder="Your username" autocomplete="username" />
      </div>
      <div class="field">
        <label class="field-label" id="lbl-user-caretaker">Caretaker Name</label>
        <input class="field-input" type="text" id="user-caretaker"
          placeholder="Your caretaker's username (optional)" autocomplete="off" />
        <p class="field-hint" id="lbl-user-hint">Enter your caretaker's username, or leave blank if unsure.</p>
      </div>
      <label class="keep-signed">
        <input type="checkbox" id="keep-signed-user" /><span id="lbl-keep-user"> Keep me signed in</span>
      </label>
      <div class="msg msg-error" id="user-error"></div>
      <button class="submit-btn" id="btn-user-continue" onclick="handleUserLogin()">Continue</button>
    </div>

    <!-- Caretaker login (with password) -->
    <div class="form-section hidden" id="form-login">
      <div class="field">
        <label class="field-label" id="lbl-login-username">Username</label>
        <input class="field-input" type="text" id="login-identity"
          placeholder="Your username" autocomplete="username" />
      </div>
      <div class="field">
        <label class="field-label" id="lbl-login-password">Password</label>
        <input class="field-input" type="password" id="login-password"
          placeholder="••••••••" autocomplete="current-password" />
      </div>
      <label class="keep-signed">
        <input type="checkbox" id="keep-signed-in" /><span id="lbl-keep-login"> Keep me signed in</span>
      </label>
      <div class="msg msg-error" id="login-error"></div>
      <button class="submit-btn" id="btn-login" onclick="handleLogin()">Log In</button>
    </div>

    <!-- Caretaker sign up -->
    <div class="form-section hidden" id="form-signup">
      <div class="field">
        <label class="field-label" id="lbl-signup-username">Username</label>
        <input class="field-input" type="text" id="signup-username"
          placeholder="Choose a username (letters, numbers, _)" autocomplete="username" />
      </div>
      <div class="field">
        <label class="field-label" id="lbl-signup-phone">Phone Number</label>
        <div class="phone-row">
          <select class="field-input phone-country" id="signup-country"></select>
          <input class="field-input phone-number" type="tel" id="signup-phone" inputmode="numeric" autocomplete="tel-national" />
        </div>
      </div>
      <div class="field">
        <label class="field-label" id="lbl-signup-password">Password</label>
        <input class="field-input" type="password" id="signup-password"
          placeholder="At least 6 characters" autocomplete="new-password" />
      </div>
      <div class="field">
        <label class="field-label" id="lbl-signup-confirm">Confirm Password</label>
        <input class="field-input" type="password" id="signup-confirm"
          placeholder="Repeat your password" autocomplete="new-password" />
      </div>
      <div class="msg msg-error"   id="signup-error"></div>
      <div class="msg msg-success" id="signup-success"></div>
      <button class="submit-btn" id="btn-signup" onclick="handleSignup()">Create Account</button>
    </div>
  </div>

  <a class="back-link" id="back-link" href="home.html">← Back to role selection</a>

  <script>
    const params = new URLSearchParams(location.search);
    const role   = params.get('role') === 'caretaker' ? 'caretaker' : 'user';
    const isUser = role === 'user';
    const destPage = isUser ? 'user.html' : 'caretaker.html';

    document.getElementById('role-badge').textContent =
      isUser ? 'Sign in as User' : 'Sign in as Caretaker';

    if (isUser) {
      document.getElementById('auth-tabs').style.display = 'none';
      document.getElementById('form-user-login').classList.remove('hidden');
    } else {
      document.getElementById('form-login').classList.remove('hidden');
    }

    // ── Session helpers ──────────────────────────────────────────────────────
    function getSession() {
      try { return JSON.parse(localStorage.getItem('auth_session') || sessionStorage.getItem('auth_session') || 'null'); }
      catch { return null; }
    }

    function saveSession(session, persist) {
      const data = JSON.stringify(session);
      if (persist) { localStorage.setItem('auth_session', data); sessionStorage.removeItem('auth_session'); }
      else { sessionStorage.setItem('auth_session', data); localStorage.removeItem('auth_session'); }
    }

    // Already logged in with the right role → skip login
    const existing = getSession();
    if (existing && existing.role === role) window.location.replace(destPage);

    function getUsers()       { try { return JSON.parse(localStorage.getItem('auth_users')) || []; } catch { return []; } }
    function saveUsers(users) { localStorage.setItem('auth_users', JSON.stringify(users)); }

    async function hashPassword(password) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(password));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function showMsg(id, text) { const el = document.getElementById(id); el.textContent = text; el.classList.add('show'); }
    function hideMsg(id)       { const el = document.getElementById(id); el.textContent = ''; el.classList.remove('show'); }

    function showTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('tab-login').classList.toggle('active',  isLogin);
      document.getElementById('tab-signup').classList.toggle('active', !isLogin);
      document.getElementById('form-login').classList.toggle('hidden',  !isLogin);
      document.getElementById('form-signup').classList.toggle('hidden', isLogin);
    }

    // ── User login (no password required) ───────────────────────────────────
   async function handleUserLogin() {
      hideMsg('user-error');
      const username      = document.getElementById('user-username').value.trim();
      const caretakerName = document.getElementById('user-caretaker').value.trim();
      const keep          = document.getElementById('keep-signed-user').checked;

      const T = window.loginT || {};
      if (!username)                          { showMsg('user-error', T.errUsername      || 'Please enter your username.'); return; }
      if (username.length < 3)                { showMsg('user-error', T.errUsernameLen   || 'Username must be at least 3 characters.'); return; }
      if (!/^[a-zA-Z0-9_]+$/.test(username)) { showMsg('user-error', T.errUsernameChars || 'Username can only contain letters, numbers, and underscores.'); return; }

      const users = getUsers();
      let user = users.find(u => u.username === username && u.role === 'user');

      if (!user) {
        user = { username, role: 'user', caretakerName: caretakerName || '', assigned: false, assignedTo: '' };
        users.push(user);
      } else {
        if (caretakerName && !user.assigned) user.caretakerName = caretakerName;
      }

      // Auto-assign to caretaker — check Firestore first, fall back to localStorage
      if (caretakerName) {
        let resolvedCaretaker = null;

        if (window.getCaretaker) {
          // Try to find caretaker in Firestore (works across devices)
          resolvedCaretaker = await window.getCaretaker(caretakerName) ||
                              await window.getCaretaker(caretakerName.toLowerCase());
        }

        if (!resolvedCaretaker) {
          // Fall back to localStorage (same-device fallback)
          const localCt = users.find(u => u.username.toLowerCase() === caretakerName.toLowerCase() && u.role === 'caretaker');
          if (localCt) resolvedCaretaker = { username: localCt.username };
        }

        if (resolvedCaretaker) {
          user.caretakerName = resolvedCaretaker.username;
          // Don't auto-accept — send a pending request; caretaker must accept
          if (window.linkUserToCaretaker) {
            await window.linkUserToCaretaker(resolvedCaretaker.username, user.username);
          }
        }
      }

      saveUsers(users);
      saveSession({ username: user.username, role: 'user', caretakerName: user.caretakerName || '' }, keep);

      if (user.caretakerName && window.registerFCMToken) {
        await window.registerFCMToken(user.caretakerName, user.username);
      }

      window.location.href = destPage;
    }

    // ── Caretaker login (password required) ─────────────────────────────────
    async function handleLogin() {
      hideMsg('login-error');
      const identity = document.getElementById('login-identity').value.trim();
      const password = document.getElementById('login-password').value;
      const keep     = document.getElementById('keep-signed-in').checked;

      const T = window.loginT || {};
      if (!identity || !password) { showMsg('login-error', T.errFillAll || 'Please fill in all fields.'); return; }

      const hash  = await hashPassword(password);
      const users = getUsers();
      const match = users.find(u => u.username === identity && u.passwordHash === hash && u.role === role);

      if (!match) {
        const wrongRole = users.find(u => u.username === identity && u.passwordHash === hash);
        if (wrongRole) {
          const rw = wrongRole.role === 'user' ? (T.roleWord || 'User') : (T.roleWord || 'Caretaker');
          showMsg('login-error', `${rw} ${T.wrongRoleSuffix || 'account — go back and choose the correct role.'}`);
        } else {
          showMsg('login-error', T.errWrongCreds || 'Username or password is incorrect.');
        }
        return;
      }

      saveSession({ username: match.username, role: match.role, name: match.name || '' }, keep);
      // Sync phone to Firestore so users on other devices can reach this caretaker
      if (window.registerCaretaker && match.phone) {
        window.registerCaretaker(match.username, match.phone);
      }
      window.location.href = destPage;
    }

    // ── Caretaker sign up ────────────────────────────────────────────────────
    async function handleSignup() {
      hideMsg('signup-error'); hideMsg('signup-success');
      const username       = document.getElementById('signup-username').value.trim();
      const password       = document.getElementById('signup-password').value;
      const confirm        = document.getElementById('signup-confirm').value;
      const countrySelect  = document.getElementById('signup-country');
      const phoneInput     = document.getElementById('signup-phone');

      const T = window.loginT || {};
      if (!username || !password || !confirm) { showMsg('signup-error', T.errFillAll       || 'Please fill in all fields.'); return; }
      if (username.length < 3)                { showMsg('signup-error', T.errUsernameLen    || 'Username must be at least 3 characters.'); return; }
      if (!/^[a-zA-Z0-9_]+$/.test(username)) { showMsg('signup-error', T.errUsernameChars  || 'Username can only contain letters, numbers, and underscores.'); return; }
      if (password.length < 6)               { showMsg('signup-error', T.errPassLen         || 'Password must be at least 6 characters.'); return; }
      if (password !== confirm)              { showMsg('signup-error', T.errPassMatch        || 'Passwords do not match.'); return; }
      if (!isPhoneValid(countrySelect, phoneInput)) {
        showMsg('signup-error', T.errPhone || 'Please enter a valid phone number.'); return;
      }

      const users = getUsers();
      if (users.find(u => u.username === username && u.role === role)) {
        showMsg('signup-error', T.errUserTaken || 'This username is already taken.'); return;
      }

      const country  = getPhoneCountry(countrySelect.value);
      const digits   = phoneInput.value.replace(/\D/g, '');
      const fullPhone = '+' + country.dial + digits;
      const encPhone  = await encryptPhone(fullPhone);

      const hash = await hashPassword(password);
      users.push({ username, passwordHash: hash, role, phone: encPhone });
      saveUsers(users);

      saveSession({ username, role, phone: encPhone }, false);

      // Register caretaker in Firestore so users on other devices can find them
      if (window.registerCaretaker) await window.registerCaretaker(username, encPhone);

      showMsg('signup-success', (window.loginT && window.loginT.successCreated) || 'Account created! Taking you in…');
      setTimeout(() => { window.location.href = destPage; }, 800);
    }

    // Initialise phone picker when on sign-up tab
    document.getElementById('tab-signup').addEventListener('click', () => {
      setupPhoneInput(
        document.getElementById('signup-country'),
        document.getElementById('signup-phone')
      );
    });
    // Also init if page loads directly on signup (e.g. navigating back)
    if (!document.getElementById('form-signup').classList.contains('hidden')) {
      setupPhoneInput(
        document.getElementById('signup-country'),
        document.getElementById('signup-phone')
      );
    }

    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (isUser) { handleUserLogin(); return; }
      const loginHidden = document.getElementById('form-login').classList.contains('hidden');
      loginHidden ? handleSignup() : handleLogin();
    });

    // ── Translate the page ───────────────────────────────────────────────────
    (function translateLoginPage() {
      const lang = localStorage.getItem('caretaker_lang') ||
                   localStorage.getItem('user_lang') || 'en';
      if (lang === 'en') return;

      function tx(text) {
        return fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl='
          + lang + '&dt=t&q=' + encodeURIComponent(text))
          .then(r => r.json())
          .then(d => d[0].map(x => x[0]).join(''))
          .catch(() => text);
      }
      function set(id, text) { const el = document.getElementById(id); if (el) el.textContent = text; }
      function ph(id, text)  { const el = document.getElementById(id); if (el) el.placeholder  = text; }

      const badge = document.getElementById('role-badge');
      const items = [
        { id: 'role-badge',          en: badge ? badge.textContent : (isUser ? 'Sign in as User' : 'Sign in as Caretaker') },
        { id: 'tab-login',           en: 'Log In' },
        { id: 'tab-signup',          en: 'Sign Up' },
        { id: 'back-link',           en: 'Back to role selection' },
        { id: 'lbl-user-username',   en: 'Username' },
        { id: 'lbl-user-caretaker',  en: 'Caretaker Name' },
        { id: 'lbl-user-hint',       en: "Enter your caretaker's username, or leave blank if unsure." },
        { id: 'lbl-keep-user',       en: ' Keep me signed in' },
        { id: 'btn-user-continue',   en: 'Continue' },
        { id: 'lbl-login-username',  en: 'Username' },
        { id: 'lbl-login-password',  en: 'Password' },
        { id: 'lbl-keep-login',      en: ' Keep me signed in' },
        { id: 'btn-login',           en: 'Log In' },
        { id: 'lbl-signup-username', en: 'Username' },
        { id: 'lbl-signup-phone',    en: 'Phone Number' },
        { id: 'lbl-signup-password', en: 'Password' },
        { id: 'lbl-signup-confirm',  en: 'Confirm Password' },
        { id: 'btn-signup',          en: 'Create Account' },
      ];
      const placeholders = [
        { id: 'user-username',   en: 'Your username' },
        { id: 'user-caretaker',  en: "Your caretaker's username (optional)" },
        { id: 'login-identity',  en: 'Your username' },
        { id: 'signup-username', en: 'Choose a username (letters, numbers, _)' },
        { id: 'signup-password', en: 'At least 6 characters' },
        { id: 'signup-confirm',  en: 'Repeat your password' },
      ];
      const errors = [
        'Please enter your username.',
        'Username must be at least 3 characters.',
        'Username can only contain letters, numbers, and underscores.',
        'Please fill in all fields.',
        'Username or password is incorrect.',
        'Password must be at least 6 characters.',
        'Passwords do not match.',
        'This username is already taken.',
        'Please enter a valid phone number.',
        'Account created! Taking you in...',
      ];

      Promise.all(items.map(i => tx(i.en))).then(res => items.forEach((item, i) => set(item.id, res[i])));
      Promise.all(placeholders.map(p => tx(p.en))).then(res => placeholders.forEach((p, i) => ph(p.id, res[i])));
      Promise.all(errors.map(tx)).then(res => {
        window.loginT = {
          errUsername: res[0], errUsernameLen: res[1], errUsernameChars: res[2],
          errFillAll: res[3], errWrongCreds: res[4], errPassLen: res[5],
          errPassMatch: res[6], errUserTaken: res[7], errPhone: res[8], successCreated: res[9],
        };
      });
    })();
  </script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
</body>
</html>
