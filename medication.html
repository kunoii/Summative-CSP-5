<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>document.documentElement.dataset.theme = localStorage.getItem('app-theme') || '';</script>
  <title>Medication Tracker</title>
  <link rel="stylesheet" href="medication.css" />
</head>
<body>

  <header>
    <h1>Medication Tracker</h1>
    <div class="header-btns">
      <button id="buy-pills-btn">Buy Pills</button>
      <button id="print-btn">Print History</button>
    </div>
  </header>

  <div id="low-stock-banner" style="display:none"></div>

  <div id="med-container"></div>

  <!-- Card action popup (tap a med row) -->
  <div id="card-popup">
    <div class="card-popup-box">
      <div class="card-popup-name" id="card-popup-name"></div>
      <div class="card-popup-pills" id="card-popup-pills"></div>
      <div class="card-popup-btns">
        <button class="btn-edit"    id="card-btn-edit">CHANGE</button>
        <button class="btn-restock" id="card-btn-restock">RESTOCK PILLS</button>
        <button class="btn-delete"  id="card-btn-delete">DELETE</button>
        <button class="btn-card-cancel" id="card-btn-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Buy Pills popup -->
  <div id="buy-pills-overlay">
    <div class="buy-pills-box">
      <button id="buy-pills-close">×</button>
      <h2>Running Low</h2>
      <div id="buy-pills-list"></div>
    </div>
  </div>

  <!-- Restock modal -->
  <div id="restock-overlay">
    <div id="restock-modal">
      <h2>Restock <span id="restock-med-name"></span></h2>
      <div class="field">
        <label>Pills to add</label>
        <input id="restock-input" type="number" min="0" placeholder="e.g. 30" />
      </div>
      <div id="modal-actions">
        <button id="restock-cancel">Cancel</button>
        <button id="restock-save">Add Pills</button>
      </div>
    </div>
  </div>

  <!-- View popup -->
  <div class="popup-overlay" id="view-popup">
    <div class="popup-box">
      <button id="close-view">×</button>
      <h2 id="popup-med-name"></h2>
      <div class="popup-detail">
        <span class="detail-label">Days</span>
        <span id="popup-days"></span>
      </div>
      <div class="popup-detail">
        <span class="detail-label">Times per day</span>
        <span id="popup-times"></span>
      </div>
      <div class="popup-detail">
        <span class="detail-label">Start date</span>
        <span id="popup-start"></span>
      </div>
      <div class="popup-detail">
        <span class="detail-label">Status</span>
        <span id="popup-status"></span>
      </div>
      <div id="popup-changelog"></div>
    </div>
  </div>

  <!-- Medication History modal -->
  <div id="history-overlay">
    <div class="history-box">
      <button id="history-close">×</button>
      <h2>Medication History</h2>
      <div id="history-list"></div>
    </div>
  </div>

  <!-- Camera scan overlay -->
  <div id="scan-overlay">
    <div id="scan-overlay-inner">
      <div id="scan-topbar">
        <button id="scan-close-btn">✕ Cancel</button>
        <span id="scan-label-title">Point at the medication label</span>
        <div></div>
      </div>
      <div id="scan-cam-wrap">
        <video id="scan-video" autoplay playsinline muted></video>
        <canvas id="scan-canvas"></canvas>
        <div id="scan-frame">
          <div class="corner tl"></div><div class="corner tr"></div>
          <div class="corner bl"></div><div class="corner br"></div>
        </div>
        <div id="scan-cam-start">
          <button id="scan-start-cam-btn">Enable Camera</button>
          <p>Allow camera access to scan the label</p>
        </div>
        <div id="scan-analyzing" style="display:none">
          <div class="scan-spinner"></div>
          <p>Reading label…</p>
        </div>
      </div>
      <div id="scan-controls">
        <button id="scan-capture-btn" disabled>Capture Label</button>
      </div>
    </div>
  </div>

  <!-- Add / Edit modal -->
  <div id="modal-overlay">
    <div id="modal">
      <h2 id="modal-title">Add Medication</h2>
      <button id="scan-label-btn" type="button">Scan Label</button>

      <div class="field">
        <label>Medication name</label>
        <div class="input-row">
          <input id="input-name" type="text" placeholder='e.g. "Ibuprofen"' />
          <button class="mic-btn" id="mic-name" type="button" aria-label="Speak medication name">
            <img src="micIcon.png" alt="mic" class="mic-icon" />
          </button>
        </div>
      </div>

      <div class="field">
        <label>Days of the week</label>
        <div class="days-dropdown">
          <button type="button" id="days-toggle">Select days ▾</button>
          <div class="days-menu" id="days-menu">
            <div class="day-option" data-day="Monday">Monday</div>
            <div class="day-option" data-day="Tuesday">Tuesday</div>
            <div class="day-option" data-day="Wednesday">Wednesday</div>
            <div class="day-option" data-day="Thursday">Thursday</div>
            <div class="day-option" data-day="Friday">Friday</div>
            <div class="day-option" data-day="Saturday">Saturday</div>
            <div class="day-option" data-day="Sunday">Sunday</div>
          </div>
        </div>
        <div id="days-selected-display"></div>
      </div>

    <div class="field">
      <label>Time slots</label>
      <div class="time-slots">
        <button class="period-slot" type="button" data-slot="Morning">Morning</button>
        <button class="period-slot" type="button" data-slot="Afternoon">Afternoon</button>
        <button class="period-slot" type="button" data-slot="Evening">Evening</button>
        <button class="period-slot" type="button" data-slot="Night">Night</button>
      </div>
    </div>

      <div class="field">
        <label>Reminder times</label>
        <div id="time-slots-container"></div>
      </div>

      <div class="field">
        <label>Pills remaining</label>
        <input id="pills-input" type="number" min="0" placeholder="e.g. 30" />
      </div>

      <div class="field">
        <label>Assign to</label>
        <select id="med-assign-select" class="assign-select">
          <option value="everyone">Everyone</option>
        </select>
      </div>

      <div id="modal-actions">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-save">Save</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="medication.js"></script>
  <script src="tab-bar.js"></script>
  <script src="phone.js"></script>
  <script>
  // ── Translation for medication page ──────────────────────────────────────────
  function translateText(text, lang) {
    if (lang === 'en') return Promise.resolve(text);
    return fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${lang}&dt=t&q=${encodeURIComponent(text)}`)
      .then(r => r.json()).then(d => d[0].map(x => x[0]).join('')).catch(() => text);
  }

  async function initTranslations() {
    const lang = localStorage.getItem('caretaker_lang') || 'en';

    const els = [
      { sel: 'header h1',            en: 'Medication Tracker' },
      { sel: '#buy-pills-btn',        en: 'Buy Pills' },
      { sel: '#print-btn',            en: 'Print History' },
      { sel: '#scan-label-title',     en: 'Point at the medication label' },
      { sel: '#scan-start-cam-btn',   en: 'Enable Camera' },
      { sel: '#scan-cam-start p',     en: 'Allow camera access to scan the label' },
      { sel: '#scan-analyzing p',     en: 'Reading label…' },
      { sel: '#scan-capture-btn',     en: 'Capture Label' },
      { sel: '#scan-label-btn',       en: 'Scan Label' },
      { sel: '#modal-cancel',         en: 'Cancel' },
      { sel: '#modal-save',           en: 'Save' },
      { sel: '#restock-cancel',       en: 'Cancel' },
      { sel: '#restock-save',         en: 'Add Pills' },
      { sel: '#card-btn-edit',        en: 'CHANGE' },
      { sel: '#card-btn-restock',     en: 'RESTOCK PILLS' },
      { sel: '#card-btn-delete',      en: 'DELETE' },
      { sel: '#card-btn-cancel',      en: 'Cancel' },
      { sel: '#buy-pills-btn',        en: 'Buy Pills' },
      { sel: '#buy-pills-close',      en: '×' },
      { sel: '#scan-close-btn',       en: '✕ Cancel' },
      { sel: '#modal-title',          en: 'Add Medication' },
      { sel: '#history-overlay h2',   en: 'Medication History' },
      { sel: '#history-close',        en: '×' },
      { sel: '#print-btn',            en: 'Print History' },
    ];

    // Translate all static elements in parallel
    const results = await Promise.all(els.map(e => translateText(e.en, lang)));
    els.forEach((e, i) => {
      const el = document.querySelector(e.sel);
      if (el) el.textContent = results[i];
    });

    // Translate view popup detail labels
    const detailLabelEls = document.querySelectorAll('#view-popup .detail-label');
    const detailTexts = ['Days', 'Times per day', 'Start date', 'Status'];
    const detailResults = await Promise.all(detailTexts.map(t => translateText(t, lang)));
    detailLabelEls.forEach((el, i) => { if (detailTexts[i]) el.textContent = detailResults[i]; });

    // Populate global strings used by medication.js for dynamic content
    const DAY_NAMES_EN = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

    const [addMed, changeMed, noMeds, medHistory, noHistory, pill, pills, left, remaining, lowStock, wellStocked, present, perDay, medHistoryBtn, printHistory,
           ...translatedDays] = await Promise.all([
      translateText('Add Medication', lang),
      translateText('Change Medication', lang),
      translateText('No medications yet. Tap Add Medication to get started.', lang),
      translateText('Medication History', lang),
      translateText('No medication history yet.', lang),
      translateText('pill', lang),
      translateText('pills', lang),
      translateText('left', lang),
      translateText('remaining', lang),
      translateText('Low stock', lang),
      translateText('All medications are well stocked.', lang),
      translateText('Present', lang),
      translateText('/ day', lang),
      translateText('Medication History', lang),
      translateText('Print History', lang),
      ...DAY_NAMES_EN.map(d => translateText(d, lang)),
    ]);

    const dayNames = {};
    DAY_NAMES_EN.forEach((d, i) => { dayNames[d] = translatedDays[i] || d; });

    window.medT = { addMedication: addMed, changeMedication: changeMed, noMeds, medHistory, noHistory, pill, pills, left, remaining, lowStock, wellStocked, present, perDay, medHistoryBtn, printHistory, dayNames };

    // Re-render cards so the Add Medication button and empty-state text use translated strings
    if (typeof renderCards === 'function') renderCards();

    // Field labels inside modal
    const fieldLabels = [
      { index: 0, en: 'Medication name' },
      { index: 1, en: 'Days of the week' },
      { index: 2, en: 'Times per day' },
      { index: 3, en: 'Reminder times' },
      { index: 4, en: 'Pills remaining' },
      { index: 5, en: 'Assign to' },
    ];
    const modalLabels = document.querySelectorAll('#modal .field label');
    const labelResults = await Promise.all(fieldLabels.map(f => translateText(f.en, lang)));
    fieldLabels.forEach((f, i) => {
      if (modalLabels[f.index]) modalLabels[f.index].textContent = labelResults[i];
    });

    // Buy pills heading
    const bph = document.querySelector('.buy-pills-box h2');
    if (bph) bph.textContent = await translateText('Running Low', lang);

    // Restock modal heading label
    const rh = document.querySelector('#restock-modal label');
    if (rh) rh.textContent = await translateText('Pills to add', lang);
  }

  initTranslations();
  </script>
  <script src="side-panel.js"></script>
</body>
</html>
